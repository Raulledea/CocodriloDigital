{% extends "base/base.html" %}


{% block content %}

    {% for product in products %}
    
    <div class="products">
        <img src="{{product.image.url}}" alt="Imagen de {{product.name}}">
    
        <h2>{{product.name}}</h2>
        <p>{{product.description}}</p>
        <p>{{product.price}}</p>
    </div>
    
    {% endfor %}

{% endblock content %}
