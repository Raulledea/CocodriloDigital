<nav class="navbar navbar-expand-lg navbar-dark navbar-dark-transparent navbar-fixed">
    <div class="container-fluid">
        <!-- IZQUIERDA: Brand + Links principales -->
        <div class="d-flex align-items-center">
            <a class="navbar-brand me-3" href="{% url 'home' %}">
                <img src="/static/images/logo.png" alt="CocodriloDigital" height="50">
            </a>
            <ul class="navbar-nav d-flex flex-row align-items-center gap-2 mb-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'list_products' %}">Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'carrito' %}">Carrito</a>
                </li>
            </ul>
        </div>

        <!-- CENTRO: Barra de búsqueda -->
        <form class="d-flex align-items-center mx-auto" role="search" method="get" action="{% url 'home' %}">
            <div class="search-container">
                <input name="q" class="form-control me-2 custom-search" type="search" 
                       placeholder="Buscar productos" aria-label="Buscar"/>
            </div>
            <button class="btn custom-search-btn" type="submit">Buscar</button>
        </form>

        <!-- DERECHA: Login y Sign Up -->
        <ul class="navbar-nav d-flex flex-row align-items-center gap-2 mb-0">
            {% if user.is_authenticated %}
                {% if user.is_superuser %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'add_products' %}">Agregar Producto</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'add_category' %}">Agregar Categoría</a>
                    </li>
                {% endif %}
                <li class="nav-item">
                    <a class="nav-link" href="#">{{ user.username }}</a>
                </li>
                <li class="nav-item">
                    <form method="post" action="{% url 'users:logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="nav-link btn btn-link" style="border:none; padding:0; text-decoration:none;">Logout</button>
                    </form>
                </li>
            {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'users:login' %}">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'users:register' %}">Sign Up</a>
                </li>
            {% endif %}
        </ul>

        <!-- Toggler para móviles -->
        <button class="navbar-toggler ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" 
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>

<!-- Espacio para que el contenido no quede detrás del navbar fijo -->
<div class="navbar-spacer"></div>
